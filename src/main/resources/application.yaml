spring:
  application:
    name: open-location-api

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=openLocationAPI;encrypt=true;trustServerCertificate=true
    username: ${MSSQL_USER}
    password: ${MSSQL_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate
      naming.physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    database-platform: org.hibernate.dialect.SQLServerDialect
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  ai:
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:devstral-small-2}
          temperature: 0.15
          num-ctx: 8192
          num-predict: 1024
          internal-tool-execution-enabled: true
          keep-alive: 30m
      init:
        pull-model-strategy: never

  server:
    port: 8080
  
  weather:
    api:
      key: ${WEATHER_API_KEY}